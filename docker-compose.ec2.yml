# Despliegue en 4 EC2 de la misma VPC (us-west-2), un servidor por microservicio de negocio, cada uno con su base de datos
# (igual que el esquema multi-nube del SPEC: mañana `comensales` va a Azure y `pagos` a GCP cambiando solo las URL de abajo).
#   comedor-stack  : nginx con HTTPS (único público), frontends, gateways, keycloak, n8n, ia-ml + postgres-cqrs + dynamodb + localstack
#   ec2-menu-inv   : menu-inventario + mongo            (AWS)
#   ec2-comensales : comensales-reservas + postgres     (Azure en producción)
#   ec2-pagos      : pagos-tickets + postgres           (GCP en producción)
# Imágenes: se construyen en el PC (`build` + `push` a ECR) y las EC2 solo hacen `pull`.
# Variables (.env.ec2): HOST=<ip-con-guiones>.sslip.io  ECR=<cuenta>.dkr.ecr.<región>.amazonaws.com/comedor
#                       IP_STACK, IP_MENU, IP_COMENSALES, IP_PAGOS = IP privada de cada servidor
services:
  # ---------- ec2-menu-inv ----------
  mongo:
    ports: !reset []
  menu-inventario-service:
    image: ${ECR}/menu-inventario-service:latest
    depends_on: !reset []
    environment:
      AWS_ENDPOINT_URL: http://${IP_STACK}:4566

  # ---------- ec2-comensales ----------
  postgres-comensales:
    ports: !reset []
  comensales-reservas-service:
    image: ${ECR}/comensales-reservas-service:latest
    depends_on: !reset []
    environment:
      AWS_ENDPOINT_URL: http://${IP_STACK}:4566

  # ---------- ec2-pagos ----------
  postgres-pagos:
    ports: !reset []
  pagos-tickets-service:
    image: ${ECR}/pagos-tickets-service:latest
    depends_on: !reset []
    environment:
      AWS_ENDPOINT_URL: http://${IP_STACK}:4566

  # ---------- comedor-stack ----------
  postgres-cqrs:
    ports: !reset []
  dynamodb-local:
    ports: !reset []
  ia-ml-service:
    image: ${ECR}/ia-ml-service:latest
    depends_on: !reset []
    ports: !reset []
    environment:
      MENU_URL: http://${IP_MENU}:8081
      COMENSALES_URL: http://${IP_COMENSALES}:8082
      PAGOS_URL: http://${IP_PAGOS}:8083
  keycloak:
    ports: !override ["127.0.0.1:18085:8080"]
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes: !override
      - ./deploy/ec2/realm:/opt/keycloak/data/import:ro
  api-gateway:
    image: ${ECR}/api-gateway:latest
    depends_on: !reset []
    ports: !override ["127.0.0.1:18080:8080"]
    environment:
      MENU_URL: http://${IP_MENU}:8081
      COMENSALES_URL: http://${IP_COMENSALES}:8082
      PAGOS_URL: http://${IP_PAGOS}:8083
  graphql-gateway:
    image: ${ECR}/graphql-gateway:latest
    depends_on: !reset []
    ports: !reset []
    environment:
      MENU_URL: http://${IP_MENU}:8081
      COMENSALES_URL: http://${IP_COMENSALES}:8082
      PAGOS_URL: http://${IP_PAGOS}:8083
  n8n:
    ports: !override ["127.0.0.1:15678:5678"]
    environment:
      MENU_URL: http://${IP_MENU}:8081
      PAGOS_URL: http://${IP_PAGOS}:8083
    entrypoint: ["sh", "-c", "for f in /flows/*.json; do n8n import:workflow --input=$$f; done; n8n update:workflow --id=telegramComedor01 --active=true; exec n8n start"]
  shell:
    image: ${ECR}/shell:latest
    ports: !override ["127.0.0.1:13000:80"]
    build:
      args:
        VITE_KEYCLOAK_URL: https://${HOST}:8085
        VITE_API_URL: https://${HOST}:8080
        VITE_REMOTE_PORTAL: https://${HOST}:3002/assets/remoteEntry.js
        VITE_BACKOFFICE_URL: https://${HOST}:3001?embedded=1
        VITE_BI_URL: https://${HOST}:3003?embedded=1
  backoffice-gestion:
    image: ${ECR}/backoffice-gestion:latest
    ports: !override ["127.0.0.1:13001:80"]
  portal-estudiante:
    image: ${ECR}/portal-estudiante:latest
    ports: !override ["127.0.0.1:13002:80"]
    build:
      args:
        VITE_KEYCLOAK_URL: https://${HOST}:8085
        VITE_API_URL: https://${HOST}:8080
  inteligencia-negocio:
    image: ${ECR}/inteligencia-negocio:latest
    ports: !override ["127.0.0.1:13003:3003"]
    build:
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: https://${HOST}:8085
        NEXT_PUBLIC_API_URL: https://${HOST}:8080
