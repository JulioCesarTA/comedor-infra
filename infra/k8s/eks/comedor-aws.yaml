---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "for f in /flows/*.json; do n8n import:workflow --input=$f; done; n8n update:workflow --id=telegramComedor01 --active=true; exec n8n start"]
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          valueFrom: { secretKeyRef: { name: comedor, key: n8n-user } }
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: n8n-pass } }
        - name: N8N_PORT
          value: "5678"
        - name: GENERIC_TIMEZONE
          value: "America/La_Paz"
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "false"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom: { secretKeyRef: { name: comedor, key: telegram } }
        - name: IA_URL
          value: "http://ia-ml-service:8080"
        - name: MENU_URL
          value: "http://menu-inventario-service:8080"
        - name: PAGOS_URL
          value: "http://34.70.76.125:8083"
        volumeMounts:
        - { name: flujos, mountPath: /flows }
        resources:
          requests: { memory: 400Mi, cpu: 20m }
          limits: { memory: 1Gi }
      volumes:
      - name: flujos
        configMap: { name: flujos-n8n }
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: comedor
spec:
  selector: { app: n8n }
  ports:
  - { name: p5678, port: 5678, targetPort: 5678 }

