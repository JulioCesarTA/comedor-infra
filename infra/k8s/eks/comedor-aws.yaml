apiVersion: v1
kind: Namespace
metadata:
  name: comedor

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-datos
  namespace: comedor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cqrs-datos
  namespace: comedor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamodb-datos
  namespace: comedor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ia-datos
  namespace: comedor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: comedor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: mongo
        image: mongo:7
        imagePullPolicy: Always
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: { secretKeyRef: { name: comedor, key: mongo-user } }
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: mongo-pass } }
        volumeMounts:
        - { name: datos, mountPath: /data/db }
        resources:
          requests: { memory: 256Mi, cpu: 20m }
          limits: { memory: 768Mi }
      volumes:
      - name: datos
        persistentVolumeClaim: { claimName: mongo-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: comedor
spec:
  selector: { app: mongo }
  ports:
  - { name: p27017, port: 27017, targetPort: 27017 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-cqrs
  namespace: comedor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: postgres-cqrs }
  template:
    metadata:
      labels: { app: postgres-cqrs }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: postgres-cqrs
        image: postgres:16-alpine
        imagePullPolicy: Always
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: comedor, key: cqrs-user } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: cqrs-pass } }
        - name: POSTGRES_DB
          value: "cqrs_read"
        volumeMounts:
        - { name: datos, mountPath: /var/lib/postgresql/data, subPath: pgdata }
        resources:
          requests: { memory: 128Mi, cpu: 20m }
          limits: { memory: 512Mi }
      volumes:
      - name: datos
        persistentVolumeClaim: { claimName: cqrs-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-cqrs
  namespace: comedor
spec:
  selector: { app: postgres-cqrs }
  ports:
  - { name: p5432, port: 5432, targetPort: 5432 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: comedor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: dynamodb-local }
  template:
    metadata:
      labels: { app: dynamodb-local }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      securityContext: { runAsUser: 0 }
      containers:
      - name: dynamodb-local
        image: amazon/dynamodb-local:latest
        imagePullPolicy: Always
        command: ["java", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - { name: datos, mountPath: /data }
        resources:
          requests: { memory: 256Mi, cpu: 20m }
          limits: { memory: 768Mi }
      volumes:
      - name: datos
        persistentVolumeClaim: { claimName: dynamodb-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  namespace: comedor
spec:
  selector: { app: dynamodb-local }
  ports:
  - { name: p8000, port: 8000, targetPort: 8000 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: localstack }
  template:
    metadata:
      labels: { app: localstack }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: localstack
        image: localstack/localstack:3
        imagePullPolicy: Always
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "sns,sqs,s3"
        - name: DEBUG
          value: "0"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        volumeMounts:
        - { name: init, mountPath: /etc/localstack/init/ready.d/init.sh, subPath: init-localstack.sh }
        resources:
          requests: { memory: 400Mi, cpu: 20m }
          limits: { memory: 1Gi }
      volumes:
      - name: init
        configMap: { name: init-localstack, defaultMode: 493 }
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: comedor
spec:
  selector: { app: localstack }
  ports:
  - { name: p4566, port: 4566, targetPort: 4566 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-inventario-service
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: menu-inventario-service }
  template:
    metadata:
      labels: { app: menu-inventario-service }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: menu-inventario-service
        image: 483549541027.dkr.ecr.us-west-2.amazonaws.com/comedor/menu-inventario-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: MONGO_USER
          valueFrom: { secretKeyRef: { name: comedor, key: mongo-user } }
        - name: MONGO_PASS
          valueFrom: { secretKeyRef: { name: comedor, key: mongo-pass } }
        - name: SPRING_DATA_MONGODB_URI
          value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo:27017/menu_inventario?authSource=admin"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        - name: AWS_ENDPOINT_URL
          value: "http://localstack:4566"
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 18
        resources:
          requests: { memory: 512Mi, cpu: 20m }
          limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: menu-inventario-service
  namespace: comedor
spec:
  selector: { app: menu-inventario-service }
  ports:
  - { name: p8080, port: 8080, targetPort: 8080 }

