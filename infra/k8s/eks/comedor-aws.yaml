        - name: KEYCLOAK_ADMIN
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin } }
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin-pass } }
        - name: STRIPE_SECRET_KEY
          valueFrom: { secretKeyRef: { name: comedor, key: stripe } }
        - name: DYNAMODB_ENDPOINT
          value: "http://dynamodb-local:8000"
        - name: COMENSALES_URL
          value: "http://64.236.51.69:8082"
        - name: PAGOS_URL
          value: "http://34.70.76.125:8083"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          value: "test"
        - name: AWS_SECRET_ACCESS_KEY
          value: "test"
        - name: AWS_ENDPOINT_URL
          value: "http://localstack:4566"
        - name: S3_BANDEJAS_BUCKET
          value: "comedor-uagrm-bandejas-483549541027"
        - name: S3_REGION
          value: "us-west-2"
        - name: S3_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: comedor, key: s3-key } }
        - name: S3_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: comedor, key: s3-secret } }
        - name: FIREBASE_CREDENCIALES
          valueFrom: { secretKeyRef: { name: comedor, key: firebase } }
        readinessProbe:
