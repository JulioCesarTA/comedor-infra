apiVersion: apps/v1
kind: Deployment
metadata:
  name: entrada
  namespace: comedor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: entrada }
  template:
    metadata:
      labels: { app: entrada }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { entrada: "si" }
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        command: ["sh", "-c", "until [ -f /etc/letsencrypt/live/ip-44.228.1.64/fullchain.pem ]; do sleep 5; done; nginx -g 'daemon off;' & while sleep 6h; do nginx -s reload; done"]
        volumeMounts:
        - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
        - { name: certs, mountPath: /etc/letsencrypt }
        - { name: web, mountPath: /var/www/html }
        resources:
          requests: { memory: 32Mi, cpu: 20m }
      volumes:
      - name: conf
        configMap: { name: entrada-conf }
      - name: certs
        hostPath: { path: /etc/letsencrypt, type: DirectoryOrCreate }
      - name: web
        hostPath: { path: /var/www/html, type: DirectoryOrCreate }
---
# Certificado de Let's Encrypt para la IP (perfil "shortlived", ~6 días): se pide una vez y se renueva cada 6 horas
apiVersion: batch/v1
kind: Job
metadata:
  name: certificado-inicial
  namespace: comedor
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      hostNetwork: true
      nodeSelector: { entrada: "si" }
      containers:
      - name: certbot
        image: certbot/certbot:latest
        args: ["certonly", "--standalone", "--ip-address", "44.228.1.64", "--preferred-profile", "shortlived", "--cert-name", "ip-44.228.1.64",
               "--non-interactive", "--agree-tos", "--register-unsafely-without-email"]
        volumeMounts:
        - { name: certs, mountPath: /etc/letsencrypt }
      volumes:
      - name: certs
        hostPath: { path: /etc/letsencrypt, type: DirectoryOrCreate }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovar-certificado
  namespace: comedor
spec:
  schedule: "17 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector: { entrada: "si" }
          containers:
          - name: certbot
            image: certbot/certbot:latest
            args: ["renew", "--webroot", "-w", "/var/www/html", "--quiet"]
            volumeMounts:
            - { name: certs, mountPath: /etc/letsencrypt }
            - { name: web, mountPath: /var/www/html }
          volumes:
          - name: certs
            hostPath: { path: /etc/letsencrypt, type: DirectoryOrCreate }
          - name: web
            hostPath: { path: /var/www/html, type: DirectoryOrCreate }

