  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      enableServiceLinks: false   # evita que Kubernetes inyecte variables tipo DYNAMODB_LOCAL_PORT que rompen a localstack
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        imagePullPolicy: Always
        command: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
        ports:
        - containerPort: 8080
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin } }
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin-pass } }
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        volumeMounts:
        - { name: realm, mountPath: /opt/keycloak/data/import }
        resources:
          requests: { memory: 700Mi, cpu: 20m }
          limits: { memory: 1500Mi }
      volumes:
      - name: realm
        configMap: { name: realm }
